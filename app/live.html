<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX — Carrière AMS2</title>
<style>
:root{--bg:#08090B;--p:#0E0F11;--p2:#141518;--l:#1E2024;--l2:#26282C;--ink:#F4F5F6;--ink2:#A8ADB4;--ink3:#6A6F76;
--y:#FFC62A;--y2:#E9A61F;--grn:#5FBF6A;--red:#E0503C;--sil:#C0C0C0;--bro:#CD7F32;
--mono:'JetBrains Mono',ui-monospace,monospace;--sans:Inter,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
.w{max-width:1060px;margin:0 auto;padding:20px 16px 80px}
.hdr{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:800;font-size:24px;letter-spacing:.12em;color:var(--y)}
.nav{display:flex;gap:6px;margin-left:auto}
.nav a{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:7px 14px;
border-radius:8px;cursor:pointer;color:var(--ink2);background:var(--p);border:1px solid var(--l);text-decoration:none}
.nav a.on{background:linear-gradient(180deg,#FFCB44,#E9A61F);color:#151004;font-weight:700;border-color:transparent}
.drv{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.drv input{background:#0A0B0D;border:1px solid var(--l2);color:var(--ink);border-radius:7px;padding:6px 10px;font-family:var(--mono);font-size:14px;width:200px}
.drv input:focus{outline:none;border-color:var(--y)}.drv .nm{font-size:18px;font-weight:700;display:none}
.ds{text-align:center;padding:0 10px}.ds .v{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--y)}
.ds .k{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}
/* grade tabs */
.gtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;overflow-x:auto}
.gtab{display:flex;align-items:center;gap:6px;background:var(--p);border:1px solid var(--l);border-radius:10px;
padding:8px 12px;cursor:pointer;flex:none;min-width:0}
.gtab.on{border-color:var(--y);background:var(--p2)}
.gtab.lk{opacity:.35;pointer-events:none}
.gtab.done{border-color:var(--grn)}
.gtab img{height:28px;border-radius:4px}
.gtab span{font-family:var(--mono);font-size:11px;font-weight:700;white-space:nowrap}
.gtab .st{font-size:9px;color:var(--ink3);font-weight:400}
/* championship grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ccard{background:var(--p);border:1px solid var(--l);border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s}
.ccard:hover{border-color:var(--y2)}
.ccard-img{width:100%;height:80px;object-fit:cover;background:#0A0B0D;display:block}
.ccard-body{padding:10px 12px}
.ccard-nm{font-size:13px;font-weight:700;margin-bottom:2px}
.ccard-meta{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.ccard .me-row{margin-top:4px}
/* detail overlay */
.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);overflow-y:auto}
.overlay.on{display:block}
.oinner{max-width:900px;margin:40px auto;padding:0 16px 60px}
.oclose{font-family:var(--mono);font-size:13px;color:var(--ink2);cursor:pointer;margin-bottom:10px;display:inline-block}
.oclose:hover{color:var(--y)}
.otitle{font-size:22px;font-weight:800;margin-bottom:4px}
.osub{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-bottom:14px}
.oimg{width:100%;max-height:120px;object-fit:cover;border-radius:10px;margin-bottom:14px}
/* calendrier */
.cal{margin-bottom:16px}
.cal-h{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--y);text-transform:uppercase;margin-bottom:8px}
.cal-row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--l);font-size:13px}
.cal-num{font-family:var(--mono);font-weight:800;color:var(--y);width:24px;text-align:center}
.cal-trk-img{width:60px;height:34px;object-fit:cover;border-radius:4px;background:#0A0B0D;flex:none}
.cal-nm{flex:1}
/* parametres manche */
.params{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:14px;margin-bottom:14px}
.params-h{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--y);text-transform:uppercase;margin-bottom:8px}
.params-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.param{background:var(--p2);border:1px solid var(--l2);border-radius:8px;padding:10px;text-align:center}
.param-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;margin-bottom:4px}
.param-val{font-family:var(--mono);font-size:14px;font-weight:700}
/* medals */
.mreq{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.md{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.md.g{background:rgba(255,215,0,.12);color:#FFD700}.md.sv{background:rgba(192,192,192,.12);color:var(--sil)}.md.b{background:rgba(205,127,50,.12);color:var(--bro)}
.me-row{display:flex;gap:3px}
.me{width:16px;height:16px;border-radius:50%;border:2px solid var(--l2);background:var(--p);font-size:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.me.g{border-color:#FFD700;color:#FFD700}.me.sv{border-color:var(--sil);color:var(--sil)}.me.b{border-color:var(--bro);color:var(--bro)}.me.x{border-color:var(--red);color:var(--red)}
.rbtn{margin-top:10px;background:linear-gradient(180deg,#FFCB44,#E9A61F);color:#151004;border:none;border-radius:8px;
padding:10px;font-weight:700;font-size:13px;cursor:pointer;width:100%}
.hint{font-family:var(--mono);font-size:9px;color:var(--ink3);text-align:center;margin-top:5px}
@media(max-width:560px){.cgrid{grid-template-columns:1fr}.oinner{margin:20px auto}}
</style></head><body>

var G=D.grades,CI=D.catImgs,TI=D.trkImgs;
var P={name:'',grade:1,races:0,res:{}},curG=1;
function sv(){try{localStorage.setItem('apxC4',JSON.stringify(P))}catch(e){}}
function ld(){try{var p=JSON.parse(localStorage.getItem('apxC4'));if(p)P=p}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function canProm(gn){var g=G.find(function(x){return x.n===gn;});if(!g)return false;
for(var i=0;i<g.comps.length;i++){var c=g.comps[i];var r=P.res[c.name]||[];if(r.length<c.races)return false;
var cg=0,cs=0;for(var j=0;j<r.length;j++){if(r[j]===1)cg++;else if(r[j]===2)cs++;else if(r[j]>5)return false;}
if(cg<c.gold||cs<c.silver)return false;}return true;}

function render(){
  document.getElementById('sG').textContent=P.grade;
  document.getElementById('sR').textContent=P.races;
  if(P.name){document.getElementById('pI').style.display='none';var n=document.getElementById('pN');n.style.display='block';n.textContent=P.name;}
  // grade tabs with category images
  var gt=document.getElementById('GT');gt.innerHTML='';
  G.forEach(function(g){
    var st=P.grade>g.n?'done':(P.grade===g.n?'on':'lk');
    var img=CI[g.comps.length?g.comps[0].cls:'']||'';
    var el=document.createElement('div');el.className='gtab '+st;
    el.innerHTML=(img?'<img src="'+img+'">':'')+'<div><span>'+esc(g.nom)+'</span><br><span class="st">'+g.comps.length+' champ.</span></div>';
    if(st!=='lk')el.addEventListener('click',function(){curG=g.n;renderGrid();});
    gt.appendChild(el);
  });
  renderGrid();
}
function renderGrid(){
  var g=G.find(function(x){return x.n===curG;});if(!g)return;
  var cg=document.getElementById('CG');cg.innerHTML='';
  g.comps.forEach(function(c,ci){
    var img=CI[c.cls]||'';var r=P.res[c.name]||[];
    var el=document.createElement('div');el.className='ccard';
    var medals='';if(r.length){medals='<div class="me-row">';for(var i=0;i<r.length;i++){var cl=r[i]===1?'g':(r[i]===2?'sv':(r[i]<=5?'b':'x'));medals+='<span class="me '+cl+'">'+r[i]+'</span>';}medals+='</div>';}
    el.innerHTML=(img?'<img class="ccard-img" src="'+img+'">':'<div class="ccard-img"></div>')
      +'<div class="ccard-body"><div class="ccard-nm">'+esc(c.name)+'</div>'
      +'<div class="ccard-meta">'+c.races+' courses \u00b7 '+c.ai+' IA \u00b7 '+esc(c.cls)+'</div>'
      +medals+'</div>';
    el.addEventListener('click',function(){showDetail(curG,ci);});
    cg.appendChild(el);
  });
}
function showDetail(gn,ci){
  var g=G.find(function(x){return x.n===gn;});if(!g)return;
  var c=g.comps[ci];var img=CI[c.cls]||'';var r=P.res[c.name]||[];
  var h='<div class="oclose" onclick="closeOv()">\u2190 Retour</div>';
  h+=(img?'<img class="oimg" src="'+img+'">':'');
  h+='<div class="otitle">'+esc(c.name)+'</div>';
  h+='<div class="osub">'+c.races+' courses \u00b7 '+c.ai+' IA \u00b7 Classe '+esc(c.cls)+'</div>';
  // medals required
  h+='<div class="mreq"><span class="md g">'+c.gold+'\u00d7 P1 (Or)</span><span class="md sv">'+c.silver+'\u00d7 P2 (Argent)</span><span class="md b">'+c.bronze+'\u00d7 P3-5 (Bronze)</span></div>';
  // medals earned
  if(r.length){h+='<div class="me-row" style="margin-bottom:12px">';for(var i=0;i<r.length;i++){var cl=r[i]===1?'g':(r[i]===2?'sv':(r[i]<=5?'b':'x'));h+='<span class="me '+cl+'">'+r[i]+'</span>';}h+='</div>';}
  // calendrier
  h+='<div class="cal"><div class="cal-h">Calendrier</div>';
  for(var i=0;i<c.tids.length;i++){
    var timg=TI[c.tids[i]]||'';var done=i<r.length;
    h+='<div class="cal-row" style="'+(done?'opacity:.5':'')+'">'
      +'<span class="cal-num">'+(i+1)+'</span>'
      +(timg?'<img class="cal-trk-img" src="'+timg+'">':'')
      +'<span class="cal-nm">'+esc(c.tnames[i])+'</span>'
      +(done?'<span class="me '+(r[i]===1?'g':(r[i]===2?'sv':(r[i]<=5?'b':'x')))+'">P'+r[i]+'</span>':'')
      +'</div>';
  }
  h+='</div>';
  // parametres de manche
  h+='<div class="params"><div class="params-h">Param\u00e8tres \u00e0 configurer dans AMS2</div>';
  h+='<div class="params-grid">';
  h+='<div class="param"><div class="param-lbl">Essais</div><div class="param-val">On \u00b7 30 min</div></div>';
  h+='<div class="param"><div class="param-lbl">Qualifications</div><div class="param-val">On \u00b7 20 min</div></div>';
  h+='<div class="param"><div class="param-lbl">Course 1</div><div class="param-val">On \u00b7 '+c.session+' tours</div></div>';
  h+='<div class="param"><div class="param-lbl">Course 2</div><div class="param-val">On \u00b7 '+Math.max(3,Math.round(c.session*0.66))+' tours</div></div>';
  h+='<div class="param"><div class="param-lbl">Comp\u00e9tence IA</div><div class="param-val">'+Math.min(100,75+gn*4)+'</div></div>';
  h+='<div class="param"><div class="param-lbl">Agressivit\u00e9 IA</div><div class="param-val">Moyen</div></div>';
  h+='<div class="param"><div class="param-lbl">M\u00e9t\u00e9o</div><div class="param-val">Al\u00e9atoire</div></div>';
  h+='<div class="param"><div class="param-lbl">Nombre IA</div><div class="param-val">'+c.ai+'</div></div>';
  h+='</div></div>';
  // race button
  if(r.length<c.races){
    h+='<button class="rbtn" onclick="sim('+gn+','+ci+')">Simuler course '+(r.length+1)+'/'+c.races+' (proto)</button>';
    h+='<div class="hint">En vrai, APEX lira ton r\u00e9sultat depuis AMS2</div>';
  }
  document.getElementById('OI').innerHTML=h;
  document.getElementById('OV').classList.add('on');
}
function closeOv(){document.getElementById('OV').classList.remove('on');}
document.getElementById('OV').addEventListener('click',function(e){if(e.target===this)closeOv();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeOv();});

function sim(gn,ci){
  var g=G.find(function(x){return x.n===gn;});if(!g)return;var c=g.comps[ci];
  var p=1+Math.floor(Math.random()*6);if(!P.res[c.name])P.res[c.name]=[];
  if(P.res[c.name].length<c.races){P.res[c.name].push(p);P.races++;}
  if(canProm(P.grade)&&P.grade<G.length){P.grade++;curG=P.grade;alert('\ud83c\udfc6 PROMOTION au Grade '+P.grade+' !');}
  sv();showDetail(gn,ci);render();
}
document.getElementById('pI').addEventListener('change',function(e){var v=e.target.value.trim();if(!v)return;P.name=v;sv();render();});
ld();if(P.grade)curG=P.grade;render();
</script></body></html>
